<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 164" width="1100" height="164" role="img" aria-label="The five window classes of detection v0.2">
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#141b23"/><line x1="0" y1="0" x2="0" y2="6" stroke="#3a4654" stroke-width="2"/></pattern></defs>
<rect width="1100" height="164" rx="12" fill="#0b0f14"/><rect x="20" y="16" width="206" height="132" rx="10" fill="#121922" stroke="#2a3644"/><rect x="40" y="34" width="40" height="34" rx="3" fill="url(#hatch)" stroke="#3a4654"/><text x="36" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#e6edf3">data_gap</text><text x="36" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b98a5">we could not see</text><rect x="236" y="16" width="206" height="132" rx="10" fill="#121922" stroke="#2a3644"/><rect x="256" y="34" width="40" height="34" rx="3" fill="none" stroke="#8b98a5" stroke-dasharray="1 3"/><text x="252" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#8b98a5">undetectable</text><text x="252" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b98a5">a zero would mean nothing</text><rect x="452" y="16" width="206" height="132" rx="10" fill="#121922" stroke="#2a3644"/><rect x="472" y="34" width="40" height="34" rx="3" fill="none" stroke="#ffb454" stroke-width="2" stroke-dasharray="3 3"/><rect x="472" y="65" width="40" height="3" fill="#ffb454"/><text x="468" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#ffb454">behavioral_gap</text><text x="468" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b98a5">covered, detectable, zero seen</text><rect x="668" y="16" width="206" height="132" rx="10" fill="#121922" stroke="#2a3644"/><rect x="688" y="34" width="40" height="34" rx="3" fill="none" stroke="#2a3644"/><rect x="688" y="60" width="40" height="8" rx="2" fill="#ffb454"/><text x="684" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#ffb454">deficit</text><text x="684" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b98a5">seen, but far below normal</text><rect x="884" y="16" width="206" height="132" rx="10" fill="#121922" stroke="#2a3644"/><rect x="904" y="34" width="40" height="34" rx="3" fill="none" stroke="#2a3644"/><rect x="904" y="44" width="40" height="24" rx="2" fill="#5BF0E0" opacity=".8"/><text x="900" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" font-weight="700" fill="#5BF0E0">no_gap</text><text x="900" y="120" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#8b98a5">consistent with baseline</text></svg>